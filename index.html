<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sign up Page</h1>
    <form>
       <p>Enter Full Name:</p>
       <input type="text" placeholder="Full Name" required>
       <p>Enter Phone Number:</p>
       <input type="number" placeholder="Phone Number" required>
       <p>Enter Email:</p>
       <input type="email" placeholder="Email" required>
       <p>Choose Your Course:</p>
       <select required>
        <option>CSE</option>
        <option>MECH</option>
        <option>ELEC</option>
       </select>
       <p>Select Your Gender:</p>
       <label>MALE</label>
       <input name="a" type="radio" required>
       <label>FEMALE</label>
       <input name="a" type="radio" required>
       <label>OTHER</label>
       <input name="a" type="radio" required><br><br>
       <label>Upload Photo</label><br><br>
       <input type="file" required><br><br>
       <label>Enter Your Feedback:</label><br><br>
       <textarea placeholder="Your Feedback"></textarea>
       <label>Price Range:</label><br><br>
       <input min="1" max="15" type="range" required>
       <p>Enter DOB:</p>
       <input type="date" required><br><br>
       <input type="checkbox" required>
       <label>Accept Terms and Conditions</label><br><br>
       <button>SUBMIT</button>
    </form>
</body>
</html>
